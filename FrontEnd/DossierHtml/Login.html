<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="icon" type="image/png" href="../DossierImages/logoSite/60f763c5-adfa-49ad-9b3c-9b5d1b5697e2.jpg">
    <link rel="stylesheet" href="../DossierCss/MonSiteAccueil2.css">
    <link rel="stylesheet" href="../DossierCss/Login.css">
</head>
<body>
    <header>
        <a href="MonSiteAccueil.html">
            <img class="logo" src="../DossierImages/logoSite/60f763c5-adfa-49ad-9b3c-9b5d1b5697e2detour.png" alt="Logo du site" width="100" height="100">
        </a>
        <h1 class="title">Connexion</h1>
    </header>

    <main>
        <form id="loginForm">
            <label for="email">Adresse e-mail :</label>
            <input type="email" id="email" name="email" placeholder="exemple@gmail.com" required>

            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>

            <button type="submit" class="btn">Se connecter</button>
        </form>
    </main>

    <footer class="footer">
        &copy; 2025 - Annuaire Web. Tous droits réservés.
    </footer>
    <div id="notification-container" class="notification-container"></div>
    <script type="module" src="../DossierJs/MonSiteAccueil.js"></script>
    <script type="module" src="../DossierJs/login.js"></script>
</body>
</html>
